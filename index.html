<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home Designs — Early Access</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <div class="kicker">EARLY ACCESS</div>
    <h1>Elevate your space.</h1>
    <p>Beautiful designs, straight to your inbox. Drop your email for early access — no spam, ever.</p>

    <form id="signup-form" novalidate>
      <input id="email-input" type="email" name="email" placeholder="you@example.com" autocomplete="email" required />
      <button type="submit" class="btn" id="submit-btn">Get Early Access</button>
    </form>

    <p id="form-message" class="form-message" aria-live="polite"></p>
  </main>

  <script src="script.js?v=1"></script>
</body>
</html>
