<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home Designs — 7 Days Free Trial</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="split">
    <section class="side side-copy">
      <div class="kicker"><strong>7 DAYS FREE TRIAL</strong></div>
      <h1>Your dream room, designed in seconds.</h1>
      <p>Drop your email and your 7-day free trial starts now — no credit card needed.</p>

      <form id="signup-form" novalidate>
        <input id="email-input" type="email" name="email" placeholder="you@example.com" autocomplete="email" required />
        <button type="submit" class="btn" id="submit-btn">Start Free Trial</button>
      </form>
      <p id="form-message" class="form-message" aria-live="polite"></p>
    </section>

    <section class="side side-image">
      <img id="room-img"
           src="https://images.unsplash.com/photo-1616594039964-ae9021a400a0?auto=format&fit=crop&w=1000&q=80"
           alt="AI-generated modern bedroom" />
    </section>
  </main>

  <script src="script.js?v=1"></script>
</body>
</html>
